name: Build Kernel

on:
  workflow_dispatch:

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Start Timer
        id: start_timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup KernelSU-Next
        run: |
          curl -LSs https://raw.githubusercontent.com/Youffx/KernelSU-Next/dev-legacy/kernel/setup.sh | bash -s dev-legacy

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev liblz4-tool libncurses5-dev libssl-dev lzop \
            python3 python-is-python3 rsync zip zlib1g-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup ccache
        run: |
          ccache -M 10G
          ccache -o compression=true
          ccache -o base_dir=$GITHUB_WORKSPACE
          ccache -o hash_dir=false
          ccache -z

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="youffx"
          export KBUILD_BUILD_HOST="collection"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CC="ccache gcc"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=10G

          ccache -s

          make vendor/xiaomi/miatoll_defconfig
          make olddefconfig

          make -j$(nproc --all) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbo.img 2>&1 | tee build.log || (tail -100 build.log && exit 1)

      - name: Upload kernel image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_id }}
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dtbo.img
          retention-days: 14

      - name: Show ccache statistics
        if: always()
        run: ccache -s

      - name: Get Kernel Info
        id: kinfo
        if: always()
        run: |
          echo "commit=$(git log -1 --format='%h %s')" >> $GITHUB_OUTPUT
          echo "version=$(make kernelversion)" >> $GITHUB_OUTPUT
          echo "compiler=$(aarch64-linux-gnu-gcc --version | head -n 1)" >> $GITHUB_OUTPUT
