name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup KernelSU-Next
        run: |
          curl -LSs https://raw.githubusercontent.com/Youffx/KernelSU-Next/dev-legacy/kernel/setup.sh | bash -s dev-legacy

      - name: Setup build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            python3 \
            python-is-python3 \
            ccache

      - name: Configure ccache
        run: |
          sudo ln -sf /usr/lib/ccache/bin/gcc /usr/lib/ccache/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/lib/ccache/bin/gcc /usr/lib/ccache/bin/gcc
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache --max-size=2G

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make vendor/xiaomi/miatoll_defconfig
          make -j$(nproc) 2>&1 | tee build.log || (tail -100 build.log && exit 1)

      - name: Upload kernel image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_id }}
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
          retention-days: 14
